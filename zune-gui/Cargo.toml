[package]
name = "zune-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI for Zune 30 / Zune HD (egui + eframe, MTP/MTPZ over USB)"
license = "MIT"

[features]
# Exactly one renderer backend must be selected.
#   glow -> OpenGL via glutin/CGL (smaller binary, OpenGL is deprecated on macOS)
#   wgpu -> Metal via wgpu-hal (default for the real app)
#
# `linux` is a *developer* convenience only: it adds winit's X11/Wayland backends so
# the crate can also be built on the host for fast iteration. macOS builds (the
# shipped artifacts) do not enable it, so their feature graph is exactly the one
# verified in stage 1.
#
#   cargo build --features linux             # Linux dev build
#   ./build-macos.sh                         # macOS arm64 artifacts
#
# Note: running on Linux is untested against a real Zune (nusb's Linux backend is
# used by zune-rs, but nobody has verified this GUI there).
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]
linux = ["eframe/x11", "eframe/wayland"]
# Dev only: render one frame and exit, for headless visual review (Xvfb + Mesa).
screenshot = ["eframe/__screenshot"]

[dependencies]
# ── GUI ──────────────────────────────────────────────────────────────────────
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui = "0.36"

# ── device / protocol (same versions as zune-rs, proven to cross-compile) ─────
anyhow = "1"
nusb = "0.2"
hex = "0.4"
log = "0.4.34"
env_logger = "0.11.11"

# MTPZ handshake crypto (libmtp-zune scheme)
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
cmac = "0.7"
cipher = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"

# local media / metadata
lofty = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp"] }

# ── on-disk library cache (src/cache.rs) ──────────────────────────────────────
# JSON because the cache is meant to be readable and diffable by hand.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
